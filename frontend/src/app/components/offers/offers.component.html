<section id="offers" class="offers-section">
  <div class="container-custom">
    <!-- Header: Only "العروض" as requested -->
    <div class="section-title-wrapper">
      <h2 class="section-heading">العروض</h2>
    </div>

    <!-- Empty State if no offers (Clean & Simple) -->
    @if (offers.length === 0 && !loading) {
      <div class="empty-offers-box glass-panel">
        <div class="empty-dot"></div>
        <p>لا توجد عروض ترويجية نشطة حالياً. ترقبوا باقات الخصم والهدايا قريباً!</p>
      </div>
    }

    <!-- Offers Grid: Scaled down, compact, perfectly proportioned -->
    @if (offers.length > 0) {
      <div class="offers-grid">
        @for (offer of offers; track offer.id) {
          <div class="offer-card glass-panel">
            @if (offer.imageUrl) {
              <div class="offer-image-box">
                <img [src]="offer.imageUrl" [alt]="offer.title" class="offer-img" />
              </div>
            }
            <div class="offer-content">
              <span class="offer-tag">{{ offer.badgeText }}</span>
              <h3 class="offer-title">{{ offer.title }}</h3>
              <p class="offer-desc">{{ offer.description }}</p>
              
              <div class="offer-footer">
                <button class="btn-primary offer-btn" (click)="scrollToProducts()">
                  <span>تصفح العرض</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        }
      </div>
    }
  </div>
</section>
