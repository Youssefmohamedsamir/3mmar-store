<section id="hero" class="hero-section">
  <!-- Subtle ambient glow -->
  <div class="ambient-glow"></div>

  <div class="container-custom">
    <div class="hero-inner">
      <!-- Sleek Animated Logo Display (Natural size - not oversized) -->
      <div class="logo-wrapper animate-fade-in">
        <div class="logo-box animate-logo-float">
          <div class="logo-laser"></div>
          <img src="logo.png" alt="3mmar Store" class="hero-logo-img" />
        </div>
        <div class="logo-halo"></div>
      </div>

      <!-- Typography -->
      <div class="hero-text-block animate-fade-in">
        <div class="badge-neon mb-2">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span>المتجر الرقمي للأجهزة الأصلية</span>
        </div>

        <h1 class="hero-main-title">
          <span>متجر عمار</span>
          <span class="highlight">للهواتف والإكسسوارات</span>
        </h1>

        <p class="hero-subtitle">
          {{ settings.settings().welcomeMessage }}
        </p>

        <!-- CTA "لنبدأ" Button (Compact, natural size) -->
        <div class="hero-action">
          <button class="btn-start" (click)="onStart()">
            <span>لنبدأ</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
          </button>
        </div>

        <!-- Trust Badges (Compact & clean) -->
        <div class="trust-strip">
          <div class="trust-cell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span>ضمان رسمي معتمد</span>
          </div>

          <div class="trust-cell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>توصيل سريع</span>
          </div>

          <div class="trust-cell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <span>طلب فوري واتساب وهاتف</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
