<section id="hero" class="hero-section">
  <div class="ambient-glow"></div>

  <div class="container-custom">
    <div class="hero-inner">
      <!-- Animated Logo (Natural, sleek) -->
      <div class="logo-wrapper animate-fade-in">
        <div class="logo-box animate-logo-float">
          <div class="logo-laser"></div>
          <img src="logo.png" alt="3mmar Store" class="hero-logo-img" />
        </div>
        <div class="logo-halo"></div>
      </div>

      <!-- Hero Title & Circular Action -->
      <div class="hero-text-block animate-fade-in">
        <h1 class="hero-brand-name">3mmar $tore</h1>

        <!-- Circular CTA Button: "دايرة في النصف" -->
        <div class="hero-actions-row">
          <button class="btn-start-circle" (click)="onStart()" title="ابدأ التصفح" aria-label="ابدأ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
