<section id="hero" class="hero-section">
  <div class="ambient-glow"></div>

  <div class="container-custom">
    <div class="hero-inner">
      <!-- Animated Logo (Natural, sleek) -->
      <div class="logo-wrapper animate-fade-in">
        <div class="logo-box animate-logo-float">
          <div class="logo-laser"></div>
          <img src="logo.png" alt="3mmar Store" class="hero-logo-img" />
        </div>
        <div class="logo-halo"></div>
      </div>

      <!-- Hero Title: ONLY Store Name "3mmar $tore" as explicitly requested -->
      <div class="hero-text-block animate-fade-in">
        <h1 class="hero-brand-name">3mmar $tore</h1>

        <!-- CTA Button: "لنبدأ" -->
        <div class="hero-actions-row">
          <button class="btn-start" (click)="onStart()">
            <span>لنبدأ</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
          </button>
        </div>

        <!-- Trust strip (Compact & clean) -->
        <div class="trust-strip">
          <div class="trust-cell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span>أجهزة وإكسسوارات أصلية</span>
          </div>

          <div class="trust-cell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>طلب فوري مباشر</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
