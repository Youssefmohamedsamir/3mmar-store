<section id="hero" class="hero-section">
  <div class="ambient-glow"></div>

  <div class="container-custom">
    <div class="hero-inner">
      <!-- Animated Logo (Natural, sleek) -->
      <div class="logo-wrapper animate-fade-in">
        <div class="logo-box animate-logo-float">
          <div class="logo-laser"></div>
          <img src="logo.png" alt="3mmar Store" class="hero-logo-img" />
        </div>
        <div class="logo-halo"></div>
      </div>

      <!-- Hero Title: ONLY Store Name "3mmar Store" as explicitly requested -->
      <div class="hero-text-block animate-fade-in">
        <h1 class="hero-brand-name">3mmar Store</h1>
        <p class="hero-location-text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="loc-icon">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>مدينة السادات</span>
        </p>

        <!-- CTA Buttons: "لنبدأ" + "تنزيل التطبيق" (Android & iPhone) -->
        <div class="hero-actions-row">
          <button class="btn-start" (click)="onStart()">
            <span>لنبدأ</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
          </button>

          <button class="btn-download-app" (click)="pwa.installApp()" title="تنزيل التطبيق للآيفون والأندرويد">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
              <path d="M12 7v6m-3-3l3 3 3-3"></path>
            </svg>
            <span>تنزيل التطبيق</span>
          </button>
        </div>

        <!-- Trust strip (Compact & clean) -->
        <div class="trust-strip">
          <div class="trust-cell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span>أجهزة وإكسسوارات أصلية</span>
          </div>

          <div class="trust-cell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>طلب فوري مباشر</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
